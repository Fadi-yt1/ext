<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tervyn VPN</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main id="home">
    <header class="top">
      <img src="../../icons/logo96.png" alt="" width="30" height="30" />
      <div class="brand">Tervyn <span>VPN</span></div>
      <button class="btn ghost icon" id="openOptions" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <div class="banner hidden" id="controlBanner"></div>

    <section class="hero" data-status="off" id="hero">
      <button class="power" id="power" aria-label="Connect">
        <span class="ring"></span>
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
      </button>
      <div class="status" id="statusText">Not protected</div>
      <div class="sub" id="statusSub">Tap to connect to the fastest free server</div>
      <div class="timer hidden" id="timer">00:00</div>
    </section>

    <section class="progress-wrap hidden" id="progressWrap">
      <div class="progress-row"><span id="progressPhase">Testing servers</span><span id="progressCount"></span></div>
      <div class="progress" id="progressBar"><i></i></div>
    </section>

    <section class="card server" id="serverCard">
      <div class="flag" id="srvFlag">🌐</div>
      <div class="srv-main">
        <div class="srv-title" id="srvTitle">Fastest server</div>
        <div class="srv-sub faint" id="srvSub">Chosen automatically when you connect</div>
      </div>
      <span class="pill hidden" id="srvLatency"></span>
    </section>

    <section class="row">
      <label class="lbl" for="country">Location</label>
      <select id="country"><option value="">⚡ Fastest available</option></select>
    </section>

    <section class="mode">
      <div class="seg" role="group" aria-label="Routing mode">
        <button data-mode="all" aria-pressed="true">All sites</button>
        <button data-mode="sites" aria-pressed="false">Only my sites</button>
      </div>
      <div class="site-row hidden" id="siteRow">
        <div class="site-text">
          <div class="site-name" id="siteName">—</div>
          <div class="faint small" id="siteHint">Route this site through Tervyn</div>
        </div>
        <label class="switch"><input type="checkbox" id="siteToggle" /><span></span></label>
      </div>
    </section>

    <footer class="actions">
      <button class="btn" id="openServers">Servers <span class="count" id="serverCount">0</span></button>
      <button class="btn" id="refresh" title="Download the lists again and find more working servers">Find more</button>
    </footer>
  </main>

  <main id="servers" class="hidden">
    <header class="top">
      <button class="btn ghost icon" id="back" aria-label="Back">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="brand">Servers</div>
      <button class="btn small" id="retest">Re-test</button>
    </header>
    <div class="list-tools">
      <select id="filterCountry"><option value="">All countries</option></select>
      <label class="chk"><input type="checkbox" id="onlyWorking" checked /> Working only</label>
    </div>
    <ul class="list" id="serverList"></ul>
    <p class="empty faint hidden" id="emptyList">No verified servers yet. Connect or press “Find more” to test the public server lists.</p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
